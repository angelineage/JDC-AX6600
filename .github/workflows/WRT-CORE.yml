#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_PROFILE:
        required: false
        type: string
        default: PLUS
      WRT_TEST:
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_PROFILE: ${{inputs.WRT_PROFILE}}
  WRT_PKG_INFO: 见本 Release 的 Packages-*.txt
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-cache.outputs.cache_prefix}}
      cache_key: ${{steps.initialize-cache.outputs.cache_key}}
      cache_started: ${{steps.initialize-cache.outputs.cache_started}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd
          sudo apt-get -yqq clean

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")
          echo "WRT_DATE=$WRT_DATE" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          WRT_PROFILE_UPPER=$(echo "${WRT_PROFILE:-PURE}" | tr '[:lower:]' '[:upper:]')
          case "$WRT_PROFILE_UPPER" in
            PURE|PLUS) ;;
            *) echo "Unsupported WRT_PROFILE: $WRT_PROFILE" >&2; exit 1 ;;
          esac
          echo "WRT_PROFILE=$WRT_PROFILE_UPPER" >> $GITHUB_ENV
          # 统一产物命名：angelineage-athena-<编译日期>-<编译时间>
          # WRT_DATE 形如 26.11.08-10.30.00（TZ=UTC-8 的编译开始时间）
          # 只发布 PLUS 单版本、只用一份平台配置，故配置名与版本档不再重复写入产物名
          echo "WRT_TAG=angelineage-athena-${WRT_DATE}" >> $GITHUB_ENV
          if [[ "$WRT_PROFILE_UPPER" == "PLUS" ]]; then
            echo "WRT_PROFILE_DESC=Plus 版（本仓库唯一发布版本），随固件集成 PassWall2（xray/sing-box 双核心）、分区扩容 partexp、网络唤醒 wolultra、ttyd、UPnP、WireGuard、cloudflared、aria2、Samba4、雅典娜 LED 屏控制等；OpenClash、Docker/Dockerman、AdGuard Home、DDNS 在 Config/GENERAL_AX6600_PLUS.txt 中留作可选但为注释状态，固件内不含这些插件。实际内置组件以本 Release 文末清单为准" >> $GITHUB_ENV
          else
            echo "WRT_PROFILE_DESC=纯净版，轻量稳定，仅含基础网络与常用管理插件，扩展插件按需自行安装" >> $GITHUB_ENV
          fi
          WRT_INFO="${WRT_SOURCE%%/*}"
          echo "WRT_INFO=$WRT_INFO" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_EXTRA_CONFIG=$([[ -f ./Config/GENERAL_AX6600_${WRT_PROFILE_UPPER}.txt ]] && echo ./Config/GENERAL_AX6600_${WRT_PROFILE_UPPER}.txt || true)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          # Plus 版补充 PassWall 依赖包 feed（xray/sing-box 等）。
          # LuCI 插件本体由 Packages.sh 克隆到 package/，这里不再加 LuCI feed，避免同名包双重定义。
          if [[ "$WRT_PROFILE" == "PLUS" ]]; then
            echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages" >> feeds.conf.default
          fi

      - name: Fix QCA8081 Port Clocks
        run: |
          cd ./wrt/
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-qca8081-clock-fix.sh"

      - name: Install Custom RootFS Files
        run: |
          # OpenWrt buildroot 的 files/ 机制：编译时原样并入 rootfs。
          # Files/etc/config/fstab 提供一份默认 fstab，消除 preinit 阶段
          # "block: unable to load configuration (fstab: Entry not found)" 告警。
          # 保留配置升级时以设备 overlay 中的 /etc/config/fstab 为准，不会被覆盖。
          cd ./wrt/
          mkdir -p ./files/
          cp -a "$GITHUB_WORKSPACE/Files/." ./files/
          find ./files -type f -print | sort

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      # Cache lifecycle adapted from VIKINGYFY/OpenWRT-CI (MIT, Copyright 2026 VIKINGYFY).
      - name: Initialize Cache Values
        id: initialize-cache
        if: env.WRT_TEST != 'true'
        run: |
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          # 保留目标硬件配置名($WRT_CONFIG)隔离；当前仅构建 PLUS 单版本，缓存键不含版本标识
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_TARGET-$WRT_SUBTARGET-$WRT_CONFIG"
          WRT_CACHE_KEY="$WRT_CACHE_PREFIX-$(git -C ./wrt rev-parse HEAD)"
          WRT_CACHE_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_KEY=$WRT_CACHE_KEY"
          } >> "$GITHUB_ENV"
          {
            echo "cache_prefix=$WRT_CACHE_PREFIX"
            echo "cache_key=$WRT_CACHE_KEY"
            echo "cache_started=$WRT_CACHE_STARTED"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Build Cache
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v4
        with:
          # 缓存内容（ccache/宿主工具/工具链）与 profile 无关，单版本构建不会让缓存翻倍挤占配额
          key: ${{env.WRT_CACHE_KEY}}
          # 迁移时仅回退到同一源码提交的旧键，避免旧前缀混用其他分支。
          restore-keys: |
            ${{env.WRT_CACHE_PREFIX}}-
            ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: env.WRT_TEST != 'true' && steps.check-cache.outputs.cache-matched-key != ''
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skipped done!"
          else
            echo "caches missed!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 额外强制安装缺失的 python 依赖
          ./scripts/feeds install -f python3-pysocks python3-unidecode


      - name: Custom Packages
        run: |
          cd ./wrt/package/

          : > "$GITHUB_WORKSPACE/package-versions.txt"
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          if [[ "$WRT_PROFILE" == "PLUS" && -e ../feeds/passwall_packages/.git ]]; then
            echo "passwall_packages(feed) Openwrt-Passwall/openwrt-passwall-packages main $(git -C ../feeds/passwall_packages rev-parse --short HEAD)" >> "$GITHUB_WORKSPACE/package-versions.txt"
          fi
          if [ -s "$GITHUB_WORKSPACE/package-versions.txt" ]; then
            {
              echo 'WRT_PKG_INFO<<EOF'
              cat "$GITHUB_WORKSPACE/package-versions.txt"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi
          #$GITHUB_WORKSPACE/Scripts/Handles.sh

          cd $GITHUB_WORKSPACE/wrt/
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            #cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL_AX6600.txt ${WRT_EXTRA_CONFIG:+$GITHUB_WORKSPACE/${WRT_EXTRA_CONFIG#./}} >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          cp .config .config.seed

          make defconfig -j$(nproc)
          make clean -j$(nproc)

          echo "=== 正在执行 .config 配置断言校验 ==="
          FAIL=0

          # 1. 检查 SONiC FullCone 是否入选
          if ! grep -q "^CONFIG_PACKAGE_fullconenat-sonic=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_fullconenat-sonic 未入选！"
            FAIL=1
          fi

          # 2. 检查旧版 NSS 模块是否有残留
          if grep -q "^CONFIG_PACKAGE_kmod-qca-nss-" .config; then
            echo "::error::断言失败: 发现旧版 NSS 模块残留！"
            grep "^CONFIG_PACKAGE_kmod-qca-nss-" .config
            FAIL=1
          fi

          # 3. 检查旧版 FullCone 是否有残留冲突
          if grep -q "^CONFIG_PACKAGE_kmod-nft-fullcone=y" .config; then
            echo "::error::断言失败: 发现旧版 kmod-nft-fullcone 残留冲突！"
            FAIL=1
          fi

          # 4. 检查 PPE 硬件流表与 LuCI 防火墙核心 (包含 firewall4 与目标机型)
          if ! grep -q "^CONFIG_PACKAGE_kmod-nft-offload=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_kmod-nft-offload 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_luci-app-firewall=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_luci-app-firewall 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_firewall4=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_firewall4 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y" .config; then
            echo "::error::断言失败: 目标设备 CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02 未入选！"
            FAIL=1
          fi

          # 5. PLUS 核心插件入选断言 (当 WRT_PROFILE 为 PLUS 时)
          if [[ "${WRT_PROFILE_UPPER:-${WRT_PROFILE}}" == "PLUS" ]]; then
            echo "--- 检查 PLUS 核心插件意图一致性 ---"
            # 此列表用于「声明启用则必须入选」的意图校验；配置中未启用的条目会跳过（SKIP），
            # 不代表这些插件已随固件集成，实际内置组件以 manifest 生成的 WRT_LIST 为准。
            for PKG in luci-app-passwall2 luci-app-openclash luci-app-dockerman luci-app-adguardhome luci-app-wolultra; do
              PKG_INTENT="CONFIG_PACKAGE_${PKG}=y"
              if [[ -f .config.seed ]]; then
                PKG_INTENT=$(grep -E "^(#\s*)?CONFIG_PACKAGE_${PKG}(=|[[:space:]])" .config.seed | tail -n 1 || true)
              fi

              if [[ "$PKG_INTENT" == "CONFIG_PACKAGE_${PKG}=y" ]]; then
                if grep -q "^CONFIG_PACKAGE_${PKG}=y" .config; then
                  echo "  [PASS] PLUS 核心插件 ${PKG}: 已声明启用并成功入选"
                else
                  echo "::error::断言失败: PLUS 核心插件 ${PKG} 未实际入选！"
                  FAIL=1
                fi
              else
                echo "  [SKIP] PLUS 核心插件 ${PKG}: 源配置未声明启用，跳过校验"
              fi
            done
          fi

          # 6. Qualcomm PPE 时钟驱动补丁生效断言
          PPE_DRIVER="target/linux/qualcommax/files/drivers/net/ethernet/qualcomm/qca_ppe_main.c"
          IPQ6018_PATCH="target/linux/qualcommax/patches-6.18/0918-clk-qcom-gcc-ipq6018-keep-port-5-on-uniphy1-at-SGMII-rates.patch"
          IPQ8074_CONFLICT="target/linux/qualcommax/patches-6.18/0919-clk-qcom-gcc-ipq8074-keep-port-5-on-uniphy1-at-SGMII-rates.patch"
          if [ -d "target" ]; then
            if [ ! -f "$PPE_DRIVER" ]; then
              echo "::error::断言失败: Qualcomm PPE 驱动文件缺失 ($PPE_DRIVER)！"
              FAIL=1
            elif ! grep -q "ppe_port_clk_parents" "$PPE_DRIVER"; then
              echo "::error::断言失败: Qualcomm PPE 驱动未成功植入 QCA8081 时钟修复逻辑！"
              FAIL=1
            elif [ ! -s "$IPQ6018_PATCH" ]; then
              echo "::error::断言失败: IPQ6018 GCC 时钟补丁缺失或为空 ($IPQ6018_PATCH)！"
              FAIL=1
            elif [ -e "$IPQ8074_CONFLICT" ]; then
              echo "::error::断言失败: 检测到已废弃的 IPQ8074 冲突补丁残留 ($IPQ8074_CONFLICT)！"
              FAIL=1
            else
              echo "  [PASS] Qualcomm PPE QCA8081 时钟修复逻辑与分频补丁校验通过。"
            fi
          fi

          rm -f .config.seed

          if [[ $FAIL -ne 0 ]]; then
            echo "::error::配置断言校验失败，终止构建！"
            exit 1
          fi
          echo "=== .config 配置断言校验全部通过 ==="

      - name: Prepare Rust Toolchain
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: env.WRT_TEST != 'true' && always()
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: env.WRT_TEST != 'true' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_PROFILE}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: env.WRT_TEST != 'true' && success() && steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_TAG".txt
          if [ -s "$GITHUB_WORKSPACE/package-versions.txt" ]; then
            cp -f "$GITHUB_WORKSPACE/package-versions.txt" ./upload/Packages-"$WRT_TAG".txt
          fi

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              # 去掉恒定的平台前缀（qualcommax-），保留 ipq60xx 及设备型号
              NAME=${NAME#*-}
              NEW_FILE="$WRT_TAG"-"$NAME"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            # 对最终命名后的固件生成校验文件，供用户刷机前验证下载完整性；失败不阻塞发布
            (cd ./upload/ && sha256sum *.bin > sha256sums.txt) || true

            make clean -j$(nproc)
          fi

      - name: Build Summary
        run: |
          {
            echo "## WRT Build Summary"
            echo ""
            echo "- Source: \`$WRT_SOURCE\`"
            echo "- Branch: \`$WRT_BRANCH\`"
            echo "- Config: \`$WRT_CONFIG\`"
            echo "- Profile: \`$WRT_PROFILE\`"
            echo "- Target: \`$WRT_TARGET\`"
            echo "- Firmware mode: \`$WRT_WIFI\`"
            echo "- Build time: \`$WRT_DATE\`"
            echo "- Release tag: \`$WRT_TAG\`"
            echo "- Kernel: \`$WRT_KVER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.WRT_TAG }}
          tag_name: ${{ env.WRT_TAG }}
          files: ./wrt/upload/*.*
          body: |
            📦 京东云无线宝雅典娜 AX6600 定制固件（仅 PLUS 单版本，手动云编译）
            ━━━━━━━━━━━━━━━━━━━━━━━

            📌 基本信息
            源码仓库：${{ env.WRT_REPO }}
            编译分支：${{ env.WRT_BRANCH }}
            源码提交：${{ env.WRT_HASH }}
            编译时间：${{ env.WRT_DATE }}（北京时间）
            固件版本：${{ env.WRT_PROFILE }}
            版本说明：${{ env.WRT_PROFILE_DESC }}
            ━━━━━━━━━━━━━━━━━━━━━━━

            📌 外部插件来源
            以下记录构建时拉取的插件源码仓库、分支与 commit，便于复现：
            ${{ env.WRT_PKG_INFO }}

            注意：这里列的是「拉取过的源码」，部分条目（如 OpenClash）仅克隆、未在 .config 中启用，
            不代表已随固件集成。实际内置组件以本页文末「内置组件」清单为准。
            ━━━━━━━━━━━━━━━━━━━━━━━

            🧩 设备与平台
            设备型号：JDCloud RE-CS-02（京东云无线宝雅典娜 AX6600）
            硬件平台：${{ env.WRT_TARGET }} / ipq60xx
            CPU 架构：Qualcomm IPQ6010 / IPQ60xx
            ━━━━━━━━━━━━━━━━━━━━━━━

            ⚙️ 固件特性
            - Qualcomm PPE 开源硬件加速 + Linux 原生 Flowtable 硬件卸载
            - SONiC FullCone NAT1（集成于 firewall4）
            - 基于 Linux 6.18 LTS 内核 / firewall4 架构，随上游 owrt 分支更新
            - PLUS 插件随固件集成，清单见文末「内置组件」
            - GitHub Actions 手动触发云编译，缓存与宿主工具链优化
            - 编译期注入默认 fstab，消除 preinit 阶段的 fstab 告警
            ━━━━━━━━━━━━━━━━━━━━━━━

            🔐 默认登录信息
            管理地址：${{ env.WRT_IP }}
            管理密码：${{ env.WRT_PW }}
            WiFi 名称：${{ env.WRT_SSID }}
            WiFi 密码：${{ env.WRT_WORD }}
            主机名：${{ env.WRT_NAME }}
            ━━━━━━━━━━━━━━━━━━━━━━━

            📶 无线默认配置
            - 全新刷机 / 恢复出厂：由 uci-defaults 生成默认 SSID、WPA2-PSK（psk2）、地区 CN，三个射频均设为启用
            - 信道、带宽与发射功率沿用上游 wifi config 探测结果，编译期未写死
            - 保留配置升级：完全沿用设备既有 /etc/config/wireless，不会被编译期默认值覆盖
            - 第三射频（QCN9074）能否使用取决于硬件与固件；启动日志中 firmware-2.bin 为可选固件探测，缺失属预期
            ━━━━━━━━━━━━━━━━━━━━━━━

            📥 下载与刷机说明
            - 本项目仅发布 PLUS 单版本固件，不再构建 PURE 版
            - 首次从原厂固件刷入：选文件名带 factory 的文件
            - 已是 OpenWrt/ImmortalWrt 升级：选文件名带 sysupgrade 的文件
            - 刷机 / 救砖完整教程：[刷机救砖教程](${{ github.server_url }}/${{ github.repository }}/blob/main/Docs/刷机救砖教程.md)
            - Config-*.txt：本次编译的完整 .config，便于复现或二次定制
            - Packages-*.txt：构建时拉取的插件源码与 commit（含未启用项，不代表集成清单）
            - sha256sums.txt：固件校验文件，刷机前请先校验下载完整性

            ⚠️ 风险提示
            刷机存在风险，请确认：
            - 已备份原厂固件
            - 能进入 U-Boot 或 TTL 恢复
            - 了解分区结构
            ━━━━━━━━━━━━━━━━━━━━━━━

            💡 内置组件
            以下清单由本次固件 manifest 生成，是实际随固件安装的 LuCI 组件；
            OpenClash、Docker/Dockerman、AdGuard Home、DDNS 不在其中。
            ${{ env.WRT_LIST }}

            内核版本：
            ${{ env.WRT_KVER }}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: inputs.WRT_TEST != 'true' && needs.core.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
      WRT_CACHE_STARTED: ${{needs.core.outputs.cache_started}}
    steps:
      - name: Roll Build Cache
        # 清理异常只警告，不把已发布固件标为构建失败。
        continue-on-error: true
        run: |
          set -euo pipefail
          CACHES=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key,createdAt)
          CURRENT_CREATED=$(jq -r --arg key "$WRT_CACHE_KEY" '[.[] | select(.key == $key) | .createdAt] | min // empty' <<< "$CACHES")
          if [ -z "$CURRENT_CREATED" ]; then
            echo "skip cache rollover: current cache is not available"
            exit 0
          fi

          # 只清理早于本次恢复、且早于当前缓存的条目。
          # 保护重叠构建新保存的缓存，也防止重跑旧提交删除较新的缓存。
          jq -r --arg key "$WRT_CACHE_KEY" --arg started "$WRT_CACHE_STARTED" --arg current "$CURRENT_CREATED" \
            '.[] | select(.key != $key and .createdAt < $started and .createdAt < $current) | .id' <<< "$CACHES" |
            while IFS= read -r CACHE_ID; do
              [ -n "$CACHE_ID" ] || continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "::warning::Failed to delete cache $CACHE_ID"
            done
